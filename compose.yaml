services:
  graindamage:
    build: .
    image: graindamage:latest
    container_name: graindamage
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # Anything set here wins over .env; handy for one-off overrides.
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.7-flash}
    volumes:
      # Your films, so the command line inside the container has something to point at:
      #
      #   docker compose exec -u "$(id -u):$(id -g)" graindamage /bin/sh
      #   graindamage /media/Blade.Runner.1982.2160p.mkv
      #
      # Set MEDIA_DIR in .env to your library; the default keeps ./media out of the way.
      # It is read-write on purpose: the two files are written beside the film.
      - ${MEDIA_DIR:-./media}:/media
      # The same library again, at the one path the web UI will browse. /mnt is fixed in
      # the code rather than configured, so the mount is what points it at your films —
      # and it has to be readable by uid/gid 65532, the `nonroot` user the Chainguard
      # image runs as. Read-only, because the web UI only ever looks: it hands you the
      # settings, it does not write beside the film the way the command line does.
      - ${MEDIA_DIR:-./media}:/mnt:ro
    restart: unless-stopped
