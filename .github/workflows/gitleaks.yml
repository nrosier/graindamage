name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly re-scan, so a rule added upstream still finds an old commit.
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

env:
  # The official gitleaks-action needs a licence key for organisation-owned repos
  # and is no longer MIT-licensed, so the pinned upstream CLI image is used instead.
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1

jobs:
  scan:
    name: scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history — gitleaks scans every commit, not just the tip

      - name: Prepare report directory
        run: mkdir -p reports

      - name: Scan git history
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            "$GITLEAKS_IMAGE" \
            git /repo \
              --redact \
              --verbose \
              --no-banner \
              --report-format sarif \
              --report-path /repo/reports/gitleaks-history.sarif

      - name: Scan working tree
        # Runs even when the history scan failed, so one run reports everything.
        if: always()
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            "$GITLEAKS_IMAGE" \
            dir /repo \
              --redact \
              --verbose \
              --no-banner \
              --report-format sarif \
              --report-path /repo/reports/gitleaks-worktree.sarif

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-reports
          path: reports/
          # Nothing is written when the repo is clean, which is the normal case.
          if-no-files-found: ignore
          retention-days: 30
